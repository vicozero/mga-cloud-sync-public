services:
  - type: web
    name: mga-cloud-sync
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-cloud.txt
    startCommand: uvicorn render_backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: mga-cloud-sync-db
          property: connectionString
      - key: MGA_REQUIRE_API_KEY
        value: "true"
      - key: MGA_API_KEY
        generateValue: true

databases:
  - name: mga-cloud-sync-db
    plan: free
    databaseName: mga_cloud_sync
    user: mga_cloud_sync
