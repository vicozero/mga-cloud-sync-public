<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#071D34">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>Disponibilidad de Equipos</title>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#071D34;--blue:#124478;--gold:#F5B942;--green:#14A36C;--amber:#EF9100;--red:#DA2330;--bg:#F2F6F9}
body{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif;background:var(--bg);color:#1c2b3a;-webkit-user-select:none;user-select:none;padding-top:env(safe-area-inset-top)}
.header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:12px 16px;position:sticky;top:0;z-index:100}
.header-top{display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:16px;font-weight:800;margin:0}
.header .project{font-size:12px;color:var(--gold);font-weight:700;margin-top:2px}
.header .date{font-size:10px;color:rgba(255,255,255,.7);margin-top:2px}
.hamburger{background:none;border:none;color:#fff;font-size:22px;cursor:pointer;padding:4px 8px}
.add-btn{background:var(--red);color:#fff;border:none;width:32px;height:32px;border-radius:50%;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.tabs-bar{display:flex;background:rgba(255,255,255,.1);margin-top:8px;border-radius:6px;overflow:hidden}
.tab-btn{flex:1;padding:8px 4px;text-align:center;font-size:11px;font-weight:700;color:rgba(255,255,255,.5);background:none;border:none;cursor:pointer;transition:.2s}
.tab-btn.active{background:rgba(255,255,255,.15);color:#fff}
.subtabs{display:flex;background:#E8E8E8;margin-bottom:8px}
.subtab-btn{flex:1;padding:8px;text-align:center;font-size:11px;font-weight:700;color:#888;background:none;border:none;cursor:pointer}
.subtab-btn.active{background:#fff;color:var(--navy)}
.content{padding:8px 12px 80px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.kpi-row{display:flex;gap:6px;margin-bottom:8px}
.kpi{flex:1;text-align:center;padding:8px 4px;background:#fff;border-radius:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.kpi .val{font-size:20px;font-weight:800}
.kpi .lbl{font-size:9px;color:#888;font-weight:600;margin-top:2px}
.cat-header{display:flex;align-items:center;gap:0;margin:8px 0 4px;border-radius:4px;overflow:hidden}
.cat-bar{width:4px;background:var(--red);align-self:stretch}
.cat-name{font-size:12px;font-weight:700;color:var(--navy);padding:6px 8px;background:#F0F0F0;flex:1}
.eq-card{background:#fff;border-radius:8px;padding:10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);display:flex;justify-content:space-between;align-items:center;cursor:pointer}
.eq-info .name{font-size:13px;font-weight:700;color:var(--navy)}
.eq-info .eco{font-size:11px;color:#888}
.eq-info .meta{font-size:10px;color:#aaa}
.badge{display:inline-block;padding:3px 8px;border-radius:10px;font-size:10px;font-weight:700;color:#fff}
.badge-green{background:var(--green)}.badge-amber{background:var(--amber)}.badge-red{background:var(--red)}.badge-gold{background:var(--gold)}
.date-card{background:#fff;border-radius:8px;padding:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.date-card .lbl{font-size:10px;color:#888}.date-card .val{font-size:13px;font-weight:600;color:var(--navy)}
.date-card .btn{font-size:11px;font-weight:700;color:var(--blue);background:none;border:none;cursor:pointer}
.rec-card{background:#fff;border-radius:8px;padding:10px;margin-bottom:6px;box-shadow:0 1px 3px rgba(0,0,0,.06);cursor:pointer}
.rec-card .title{font-size:13px;font-weight:700;color:var(--navy)}
.rec-card .sub{font-size:11px;color:#888;margin-top:2px}
.rec-card .meta{font-size:10px;color:#aaa;margin-top:2px}
.empty{text-align:center;padding:30px;color:#aaa;font-size:13px}
.empty .icon{font-size:36px;margin-bottom:8px;opacity:.4}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px}
.section-title span{font-size:13px;font-weight:700;color:var(--navy)}
.section-title .plus{color:var(--red);font-size:22px;background:none;border:none;cursor:pointer}
.bottom-bar{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #E8E8E8;padding:8px 12px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:8px;z-index:100}
.btn-report{flex:1;padding:10px;border:none;border-radius:8px;font-size:11px;font-weight:700;color:#fff;cursor:pointer}
.btn-pdf{background:linear-gradient(135deg,var(--navy),var(--blue))}
.btn-img{background:linear-gradient(135deg,var(--red),var(--gold))}
.menu-overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;display:none}
.menu-overlay.show{display:block}
.menu{position:fixed;top:0;left:0;width:280px;height:100%;background:#fff;z-index:201;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto}
.menu.open{transform:translateX(0)}
.menu-header{padding:16px;background:#F0F0F0;border-bottom:1px solid #E8E8E8}
.menu-header .name{font-size:16px;font-weight:700;color:var(--navy)}
.menu-header .ver{font-size:11px;color:#888}
.menu-item{display:flex;align-items:center;gap:10px;padding:12px 16px;border:none;background:none;width:100%;text-align:left;font-size:13px;color:var(--navy);cursor:pointer;border-bottom:1px solid #F5F5F5}
.menu-item:active{background:#F5F5F5}
.menu-item .icon{font-size:16px;width:24px;text-align:center;color:var(--blue)}
.menu-item.danger{color:var(--red)}.menu-item.danger .icon{color:var(--red)}
.menu-divider{height:1px;background:#E8E8E8;margin:4px 0}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:300;display:none;align-items:flex-end;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-height:85vh;overflow-y:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.modal h2{font-size:16px;font-weight:700;color:var(--navy);margin-bottom:12px}
.modal-sub{font-size:11px;font-weight:700;color:#5C6E7F;margin:-8px 0 12px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;font-weight:600;color:#888;margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px;border:1px solid #DCE6EC;border-radius:8px;font-size:14px;background:#fff}
.field textarea{min-height:60px;resize:vertical}
.field-row{display:flex;gap:8px}
.field-row .field{flex:1}
.modal-actions{display:flex;gap:8px;margin-top:16px}
.modal-actions button{flex:1;padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn-save{background:var(--blue);color:#fff}
.btn-cancel{background:#E8E8E8;color:#333}
.btn-danger{background:#E5484D;color:#fff}
.btn-delete{background:var(--red);color:#fff}
.supervisor-bar{background:#F0F0F0;padding:8px 12px;display:none;align-items:center;gap:8px}
.supervisor-bar.show{display:flex}
.supervisor-bar input{flex:1;padding:8px;border:1px solid #DCE6EC;border-radius:6px;font-size:13px}
.supervisor-bar button{padding:8px 12px;background:var(--blue);color:#fff;border:none;border-radius:6px;font-size:12px;font-weight:700}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:400;display:none;white-space:nowrap}
.toast.show{display:block}
.spinner{position:fixed;inset:0;background:rgba(0,0,0,.2);display:none;align-items:center;justify-content:center;z-index:500}
.spinner.show{display:flex}
.spinner-inner{background:#fff;padding:20px 30px;border-radius:12px;text-align:center}
.donut-wrap{display:flex;align-items:center;gap:12px;padding:12px;background:#fff;border-radius:8px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.donut{position:relative;width:80px;height:80px}
.donut canvas{width:80px;height:80px}
.donut-val{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:var(--navy)}
</style>
</head>
<body>

<div class="spinner" id="spinner"><div class="spinner-inner"><div class="icon">⏳</div><div>Cargando...</div></div></div>
<div class="toast" id="toast"></div>

<div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
<div class="menu" id="menu">
  <div class="menu-header">
    <div class="name" id="menuProject">Proyecto</div>
    <div class="ver">v5.8.0 PWA</div>
  </div>
  <button class="menu-item" onclick="doSync()"><span class="icon">🔄</span>Sincronizar datos</button>
  <button class="menu-item" onclick="checkForUpdate()"><span class="icon">📲</span>Buscar actualizaciones</button>
  <button class="menu-item" onclick="showDownloadReports()"><span class="icon">📥</span>Descargar reportes (Excel/PDF)</button>
  <div class="menu-divider"></div>
  <button class="menu-item" onclick="showAccessConfig()"><span class="icon">🔑</span>Configurar acceso</button>
  <button class="menu-item" onclick="showSwitchProject()"><span class="icon">📁</span>Cambiar proyecto</button>
  <button class="menu-item" onclick="showNewProject()"><span class="icon">➕</span>Nuevo proyecto vacio</button>
  <button class="menu-item" onclick="duplicateProject()"><span class="icon">📋</span>Duplicar proyecto actual</button>
  <button class="menu-item" onclick="showRenameProject()"><span class="icon">✏️</span>Renombrar proyecto</button>
  <div class="menu-divider"></div>
  <button class="menu-item" onclick="clearProject()"><span class="icon">🗑️</span>Vaciar equipos del proyecto</button>
  <button class="menu-item danger" onclick="deleteProject()"><span class="icon">❌</span>Eliminar proyecto actual</button>
</div>

<header class="header">
  <div class="header-top">
    <button class="hamburger" onclick="openMenu()">☰</button>
    <div style="text-align:center">
      <div class="project" id="headerProject">Proyecto</div>
      <h1 id="headerTitle">DISPONIBILIDAD</h1>
    </div>
    <button class="add-btn" onclick="showAdd()">+</button>
  </div>
  <div class="tabs-bar" id="mainTabs">
    <button class="tab-btn active" data-tab="0" onclick="setTab(0)">DISP.</button>
    <button class="tab-btn" data-tab="1" onclick="setTab(1)">TURNO 1</button>
    <button class="tab-btn" data-tab="2" onclick="setTab(2)">TURNO 2</button>
    <button class="tab-btn" data-tab="3" onclick="setTab(3)">LLANTAS</button>
  </div>
</header>

<div class="content" id="content"></div>
<div class="supervisor-bar" id="supervisorBar">
  <span style="font-weight:700;color:var(--navy);white-space:nowrap;font-size:12px">SUPERVISOR EN TURNO</span>
  <input id="supBarInput" list="supListGlobal" placeholder="Nombre del supervisor">
  <button onclick="setBarSup()">Guardar</button>
</div>
<datalist id="supListGlobal"></datalist>
<div class="bottom-bar" id="bottomBar"></div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
  <div class="modal" id="modal" onclick="event.stopPropagation()"></div>
</div>

<script>
const API='https://mga-cloud-sync.vercel.app/disponibilidad';
const KEY='MTTOPROV';
let loggedIn=false;
function checkLogin(){
  if(loggedIn)return;
  const stored=localStorage.getItem('pwa_auth_token');
  if(stored){
    KEY=stored;
    loggedIn=true;
    api('/api/v1/verify',{method:'POST',body:JSON.stringify({token:stored})}).then(r=>r.json()).then(data=>{
      if(data&&data.valid){
        loggedIn=true;
      }else{
        loggedIn=false;
        KEY='MTTOPROV';
      }
    }).catch(()=>{loggedIn=false;KEY='MTTOPROV';});
  }
}
function saveToken(token){
  localStorage.setItem('pwa_auth_token',token);
  KEY=token;
  loggedIn=true;
}
function clearAuth(){
  localStorage.removeItem('pwa_auth_token');
  KEY='MTTOPROV';
  loggedIn=false;
}
let state={projects:[],current:0,supervisors:[],tab:0,subTab:0,date:new Date().toISOString().slice(0,10),lastSupervisor:'',editingConsumption:null,editingReport:null,editingTire:null};
let remoteIds={equipment:{},consumption:{},mechanic:{},tire:{}};

function loadLocal(){try{const d=JSON.parse(localStorage.getItem('pwa_projects'));if(d&&d.length){state.projects=d;state.current=parseInt(localStorage.getItem('pwa_current')||'0');}else{seed();}
  ['equipment','consumptions1','consumptions2','mechanicReports1','mechanicReports2','tireInspections'].forEach(k=>{state.projects.forEach(pr=>{if(pr[k])(pr[k]).forEach(stampLid);});});
  if(state.projects.length===1&&state.projects[0].id===null&&!state.projects[0].name.toUpperCase().includes('PROVIDENCIA')){state.projects[0].name='PROVIDENCIA';}
  state.lastSupervisor=localStorage.getItem('pwa_supervisor')||'';}catch(e){seed();
  ['equipment','consumptions1','consumptions2','mechanicReports1','mechanicReports2','tireInspections'].forEach(k=>{state.projects.forEach(pr=>{if(pr[k])(pr[k]).forEach(stampLid);});});
  if(state.projects.length===1&&state.projects[0].id===null&&!state.projects[0].name.toUpperCase().includes('PROVIDENCIA')){state.projects[0].name='PROVIDENCIA';}
  state.lastSupervisor=localStorage.getItem('pwa_supervisor')||'';}}
function saveLocal(){localStorage.setItem('pwa_projects',JSON.stringify(state.projects));localStorage.setItem('pwa_current',String(state.current));if(state.lastSupervisor)localStorage.setItem('pwa_supervisor',state.lastSupervisor);}
function project(){return state.projects[state.current]||null;}
function api(path,opts){
  const headers={'Content-Type':'application/json'};
  if(KEY)headers['Authorization']='Bearer '+KEY;
  return fetch(API+'/api/v1'+path,{headers:headers,...opts});
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function spin(v){document.getElementById('spinner').classList.toggle('show',v);}

function seed(){
state.projects=[{name:'PROVIDENCIA',id:null,equipment:[
    {category:'BARRENACION',name:'jumbo joy',eco:'JL-19',current_status:'FUERA DE SERVICIO'},
    {category:'BARRENACION',name:'Jumbo Sandvik DD311',eco:'JL-15',current_status:'DISPONIBLE'},
    {category:'BARRENACION',name:'Jumbo canon',eco:'JL-24',current_status:'FUERA DE SERVICIO'},
    {category:'BARRENACION',name:'Jumbo Sandvik DD311',eco:'JL-25',current_status:'DISPONIBLE'},
    {category:'ANCLAJE',name:'Anclador canon',eco:'JA-04',current_status:'FUERA DE SERVICIO'},
    {category:'ANCLAJE',name:'Anclador Resemin',eco:'JA-07',current_status:'DISPONIBLE'},
    {category:'SCOOP TRAM',name:'Caterpillar 1600',eco:'ST-25',current_status:'OPERATIVA'},
    {category:'SCOOP TRAM',name:'Caterpillar 1300',eco:'ST-18',current_status:'DISPONIBLE'},
    {category:'SCOOP TRAM',name:'Caterpillar R1600',eco:'ST-016',current_status:'DISPONIBLE'},
    {category:'SCOOP TRAM',name:'Caterpillar 1300',eco:'ST-36',current_status:'DISPONIBLE'},
    {category:'SCOOP TRAM',name:'Epiroc ST1030',eco:'ST-31',current_status:'FUERA DE SERVICIO'},
    {category:'RETROEXCAVADORAS',name:'Caterpillar 416F2',eco:'RE-09',current_status:'DISPONIBLE'},
    {category:'RETROEXCAVADORAS',name:'Caterpillar 416F2',eco:'RE-10',current_status:'DISPONIBLE'},
    {category:'ACARREO',name:'Camion bajo perfil',eco:'CBP-01',current_status:'FUERA DE SERVICIO'},
    {category:'ACARREO',name:'Camion convencional',eco:'MG-044',current_status:'DISPONIBLE'},
    {category:'ACARREO',name:'Camion volteo',eco:'MG-054',current_status:'DISPONIBLE'},
    {category:'ACARREO',name:'Camion polvorera',eco:'MG-085',current_status:'FUERA DE SERVICIO'},
    {category:'ACARREO',name:'Camion de personal',eco:'MG-033',current_status:'DISPONIBLE'},
    {category:'VEHICULOS LIGEROS',name:'Toyota Hilux',eco:'MG-113',current_status:'OPERATIVA'},
    {category:'VEHICULOS LIGEROS',name:'Toyota Hilux',eco:'MG-121',current_status:'DISPONIBLE'}
  ],consumptions1:[],consumptions2:[],mechanicReports1:[],mechanicReports2:[],tireInspections:[]}];
  state.current=0;saveLocal();
}

function setTab(i){state.tab=i;state.subTab=0;render();}
function setSubTab(i){state.subTab=i;render();}
function setBarSup(){const v=document.getElementById('supBarInput').value;if(v&&v.trim()){state.lastSupervisor=v.trim();localStorage.setItem('pwa_supervisor',state.lastSupervisor);toast('Supervisor: '+state.lastSupervisor);}else{toast('Escribe el nombre del supervisor');}}
function initSupBar(){const bar=document.getElementById('supervisorBar');if(!bar)return;const inp=document.getElementById('supBarInput');if(inp)inp.value=state.lastSupervisor||'';const dl=document.getElementById('supListGlobal');if(dl)dl.innerHTML=(state.supervisors||[]).map(s=>`<option>${s.name}</option>`).join('');bar.classList.add('show');}

function render(){
  const p=project();if(!p)return;
  document.getElementById('headerProject').textContent=p.name;
  document.getElementById('menuProject').textContent=p.name;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active',i===state.tab));
  document.getElementById('headerTitle').textContent=state.tab===3?'REVISIÓN LLANTAS':'DISPONIBILIDAD';
  const c=document.getElementById('content');
  if(state.tab===0)renderDisp(c,p);
  else if(state.tab===1||state.tab===2)renderShift(c,p,state.tab);
  else renderTires(c,p);
  renderBottomBar();
  initSupBar();
}

function renderDisp(c,p){
  const eq=p.equipment||[];
  const disp=eq.filter(e=>e.current_status==='DISPONIBLE').length;
  const ops=eq.filter(e=>e.current_status==='OPERATIVA').length;
  const fs=eq.filter(e=>e.current_status==='FUERA DE SERVICIO').length;
  const total=eq.length;
  const pct=total?Math.round((disp+ops)/total*100):0;
  let h=`<div class="kpi-row">
    <div class="kpi"><div class="val" style="color:var(--green)">${disp}</div><div class="lbl">DISPONIBLES</div></div>
    <div class="kpi"><div class="val" style="color:var(--amber)">${ops}</div><div class="lbl">OPERATIVOS</div></div>
    <div class="kpi"><div class="val" style="color:var(--red)">${fs}</div><div class="lbl">FUERA SERV.</div></div>
  </div>
  <div class="donut-wrap">
    <div class="donut"><canvas id="donutC" width="160" height="160"></canvas><div class="donut-val">${pct}%</div></div>
    <div><div style="font-size:12px;font-weight:600;color:var(--navy)">Disponibilidad operativa</div><div style="font-size:11px;color:#888">${total} equipos totales</div></div>
  </div>`;
  let lastCat=null;
  eq.forEach(e=>{
    if(e.category!==lastCat){
      h+=`<div class="cat-header"><div class="cat-bar"></div><div class="cat-name">${e.category||'SIN CATEGORIA'}</div></div>`;
      lastCat=e.category;
    }
    const sc=e.current_status==='DISPONIBLE'?'green':e.current_status==='OPERATIVA'?'amber':'red';
    h+=`<div class="eq-card" onclick='editEquipment(${JSON.stringify(e).replace(/'/g,"&#39;")})'>
      <div class="eq-info"><div class="name">${e.name}</div><div class="eco">ECO: ${e.eco}</div>
      ${e.hour_meter?'<div class="meta">Horómetro: '+e.hour_meter+'</div>':''}
      ${e.notes?'<div class="meta">'+e.notes+'</div>':''}</div>
      <span class="badge badge-${sc}">${e.current_status}</span></div>`;
  });
  if(!eq.length)h+=`<div class="empty"><div class="icon">📦</div>No hay equipos<br><button class="btn-save" style="margin-top:8px;padding:8px 16px" onclick="showAddEquipment()">Agregar equipo</button></div>`;
  c.innerHTML=h;
  drawDonut(pct);
}

function drawDonut(pct){
  const cv=document.getElementById('donutC');if(!cv)return;
  const ctx=cv.getContext('2d');const cx=80,cy=80,r=65,lw=16;
  ctx.clearRect(0,0,160,160);
  ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.strokeStyle='#E8E8E8';ctx.lineWidth=lw;ctx.stroke();
  ctx.beginPath();ctx.arc(cx,cy,r,-Math.PI/2,-Math.PI/2+Math.PI*2*pct/100);ctx.strokeStyle='#14A36C';ctx.lineWidth=lw;ctx.lineCap='round';ctx.stroke();
}

function renderShift(c,p,shift){
  const key=shift===1?'consumptions1':'consumptions2';
  const mkey=shift===1?'mechanicReports1':'mechanicReports2';
  const cons=(p[key]||[]).filter(r=>r.work_date===state.date);
  const reps=(p[mkey]||[]).filter(r=>r.work_date===state.date);
  let h=`<div class="subtabs"><button class="subtab-btn ${state.subTab===0?'active':''}" onclick="setSubTab(0)">LUBRICANTES</button><button class="subtab-btn ${state.subTab===1?'active':''}" onclick="setSubTab(1)">REPORTE MECÁNICO</button></div>`;
  h+=`<div class="date-card"><div><div class="lbl">Fecha de trabajo</div><div class="val">${state.date}</div></div><button class="btn" onclick="pickDate()">CAMBIAR</button></div>`;
  if(state.subTab===0){
    const tl=cons.filter(x=>x.unit==='L').reduce((a,b)=>a+b.quantity,0);
    const tg=cons.filter(x=>x.unit==='kg').reduce((a,b)=>a+b.quantity,0);
    h+=`<div class="kpi-row"><div class="kpi"><div class="val" style="color:var(--blue)">${cons.length}</div><div class="lbl">REGISTROS</div></div><div class="kpi"><div class="val" style="color:var(--green)">${tl.toFixed(1)}</div><div class="lbl">TOTAL LITROS</div></div><div class="kpi"><div class="val" style="color:var(--amber)">${tg.toFixed(1)}</div><div class="lbl">TOTAL KG</div></div></div>`;
    h+=`<div class="section-title"><span>Consumos de lubricantes</span><button class="plus" onclick="showAddConsumption(${shift})">⊕</button></div>`;

    else cons.forEach(x=>{h+=`<div class="rec-card" onclick='editConsumption(${JSON.stringify(x).replace(/'/g,"&#39;")},${shift})'><div class="title">${x.lubricant}</div><div class="sub">${x.quantity} ${x.unit} · ECO: ${x.eco||''} · ${x.equipment_name||''}</div><div class="meta">Turno ${x.shift} · ${x.supervisor_name||''}</div></div>`;});
  }else{
    const cor=reps.filter(x=>x.service_type==='Correctivo').length;
    const pen=reps.filter(x=>x.final_status==='Pendiente').length;
    h+=`<div class="kpi-row"><div class="kpi"><div class="val" style="color:var(--blue)">${reps.length}</div><div class="lbl">REPORTES</div></div><div class="kpi"><div class="val" style="color:var(--red)">${cor}</div><div class="lbl">CORRECTIVOS</div></div><div class="kpi"><div class="val" style="color:var(--amber)">${pen}</div><div class="lbl">PENDIENTES</div></div></div>`;
    h+=`<div class="section-title"><span>Reportes mecánicos</span><button class="plus" onclick="showAddReport(${shift})">⊕</button></div>`;
    if(!reps.length)h+=`<div class="empty"><div class="icon">🔧</div>No hay reportes para esta fecha</div>`;
    else reps.forEach(x=>{
      const sc=x.final_status==='Disponible'?'green':x.final_status==='Operativa'?'amber':x.final_status==='Pendiente'?'gold':'red';
      h+=`<div class="rec-card" onclick='editReport(${JSON.stringify(x).replace(/'/g,"&#39;")},${shift})'><div class="title">ECO: ${x.eco||''} · ${x.equipment_name||''}</div><div class="sub">${x.service_type} · ${x.mechanic_name} · HM: ${x.hour_meter||''}</div><div class="meta">${x.failure||''}</div><div style="margin-top:4px;display:flex;align-items:center;justify-content:space-between"><span class="badge badge-${sc}">${x.final_status}</span>${x.supervisor_name?`<span style="font-size:11px;color:var(--blue);font-weight:700">Sup: ${x.supervisor_name}</span>`:''}</div></div>`;
    });
  }
  c.innerHTML=h;

function renderTires(c,p){

  const total=insps.length;const tires=insps.reduce((a,b)=>a+(b.details||[]).length,0);

  insps.forEach(x=>(x.details||[]).forEach(d=>{if(d.status==='Bueno')buenas++;else if(d.status==='Aceptable')acept++;else if(d.status==='Regular')reg++;else malas++;}));

  h+=`<div class="section-title"><span>Inspecciónes de llantas</span><button class="plus" onclick="showAddTire()">⊕</button></div>`;

var MGA_LOGO_B64=null;
var _jsPDF=null;
(function(){fetch('/disponibilidad/icons/mga_logo.jpg').then(r=>r.blob()).then(b=>{const r2=new FileReader();r2.onload=()=>MGA_LOGO_B64=r2.result;r2.readAsDataURL(b);}).catch(()=>{});if(window.jspdf)_jsPDF=window.jspdf.jsPDF;})();

var PK={navy:[7,29,52],blue:[18,68,120],gold:[245,185,66],green:[20,163,108],amber:[239,145,0],red:[218,35,48],dkgray:[68,68,68],gray:[128,128,128],rowAlt:[248,250,252],border:[225,231,237],catBg:[226,236,247],supBg:[247,239,214],cardBg:[244,247,251],footerBg:[238,242,246],kpiLabel:[104,119,134],mechBg:[247,249,252]};
var PW=1240,PH=1754,MG=48,USABLE=PW-MG*2;

function _pill(doc,x,y,w,h,r,g,b){
  doc.setFillColor(r,g,b);doc.roundedRect(x,y,w,h,6,6,'F');
}

function drawLogo(doc,x,y,w,h){
  if(!MGA_LOGO_B64)return;
  try{doc.addImage(MGA_LOGO_B64,'JPEG',x,y,w,h);}catch(e){}
}

function drawHeader(doc,title,projectName,dateStr,hdrH){
  hdrH=hdrH||185;
  doc.setFillColor(...PK.navy);doc.rect(0,0,PW,hdrH,'F');
  doc.setFillColor(...PK.blue);doc.rect(PW/2,0,PW/2,hdrH,'F');
  doc.setFillColor(255,255,255,25);
  doc.circle(PW-35,hdrH,150,'F');
  doc.setFillColor(255,255,255);doc.roundedRect(48,22,120,120,16,16,'F');
  drawLogo(doc,53,27,110,110);
  doc.setFontSize(34);doc.setTextColor(255);doc.setFont('helvetica','bold');
  doc.text(title,192,64);
  doc.setFontSize(21);doc.setTextColor(...PK.gold);
  doc.text(projectName||'',192,105);
  doc.setFontSize(17);doc.setTextColor(218,229,239);doc.setFont('helvetica','normal');
  doc.text('Fecha: '+dateStr+'  |  Generado: '+new Date().toLocaleDateString('es-MX'),192,145);
  return hdrH;
}

function drawKPIs(doc,y,kpis,gap){
  gap=gap||10;
  var bandH=60,cardW=(USABLE-gap*(kpis.length-1))/kpis.length;
  doc.setFillColor(...PK.cardBg);doc.rect(0,y,PW,bandH,'F');
  kpis.forEach(function(k,i){
    var cx=MG+i*(cardW+gap);
    doc.setFillColor(255,255,255);doc.roundedRect(cx,y+6,cardW,bandH-12,9,9,'F');
    doc.setFillColor(...k.color);doc.roundedRect(cx+5,y+6,5,bandH-12,4,4,'F');
    doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(...PK.navy);
    doc.text(k.val,cx+14,y+29);
    doc.setFontSize(9);doc.setTextColor(...PK.kpiLabel);
    doc.text(k.label,cx+14,y+bandH-13);
  });
  return y+bandH;
}

function drawTableHead(doc,y,headers,colWidths,corner){
  corner=corner||10;
  doc.setFillColor(...PK.navy);doc.roundedRect(MG,y,USABLE,34,corner,corner,'F');
  doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(255);
  var x=MG+10;
  headers.forEach(function(h,i){doc.text(h,x,y+24);x+=colWidths[i];});
  return y+34;
}

function drawDataRow(doc,y,vals,colWidths,fonts,rowH,isAlt){
  rowH=rowH||46;
  if(isAlt){doc.setFillColor(...PK.rowAlt);doc.rect(MG,y,USABLE,rowH,'F');}
  doc.setFillColor(...PK.border);doc.rect(MG,y,USABLE,1,'F');
  var x=MG+14;
  vals.forEach(function(v,i){
    var fn=fonts[i]||{sz:17,style:'normal',color:PK.dkgray};
    doc.setFontSize(fn.sz);doc.setFont('helvetica',fn.style);doc.setTextColor(...fn.color);
    var maxW=colWidths[i]-20;
    if(doc.getTextWidth(v)>maxW){while(v.length>3&&doc.getTextWidth(v+'...')>maxW)v=v.slice(0,-1);v+='...';}
    doc.text(v,x,y+rowH*0.6);
    x+=colWidths[i];
  });
  return y+rowH;
}

function drawStatusPill(doc,x,y,status,cols){
  var sc=statusColor(status);
  var pw=Math.min(cols-14,170);
  var faded=[Math.round(sc[0]*0.3+255*0.7),Math.round(sc[1]*0.3+255*0.7),Math.round(sc[2]*0.3+255*0.7)];
  doc.setFillColor(...faded);doc.roundedRect(x,y+8,pw,22,9,9,'F');
  doc.setFontSize(13);doc.setFont('helvetica','bold');doc.setTextColor(...sc);
  doc.text((status||'').toUpperCase(),x+7,y+23);
}

function drawCatRow(doc,y,text){
  doc.setFillColor(...PK.catBg);doc.roundedRect(MG,y,USABLE,42,8,8,'F');
  doc.setFillColor(...PK.red);doc.roundedRect(MG,y,7,42,4,4,'F');
  doc.setFontSize(18);doc.setFont('helvetica','bold');doc.setTextColor(...PK.blue);
  doc.text(text,MG+20,y+28);
  return y+42;
}

function drawSupRow(doc,y,name){
  doc.setFillColor(...PK.supBg);doc.roundedRect(MG,y,USABLE,40,8,8,'F');
  doc.setFillColor(...PK.gold);doc.roundedRect(MG,y,7,40,4,4,'F');
  doc.setFontSize(17);doc.setFont('helvetica','bold');doc.setTextColor(...PK.blue);
  doc.text('Supervisor: '+name,MG+20,y+26);
  return y+40;
}

function drawFooter(doc,page,label){
  doc.setFillColor(...PK.footerBg);doc.rect(0,PH-45,PW,45,'F');
  doc.setFontSize(15);doc.setTextColor(...PK.gray);doc.setFont('helvetica','normal');
  doc.text(label||'Generado desde PWA Disponibilidad',MG,PH-16);
  doc.text('Página '+page,PW-MG-115,PH-16);
}

function drawMechCard(doc,y,r){
  var sc=statusColor(r.final_status);
  var cardH=250;
  doc.setFillColor(255);doc.roundedRect(MG,y,USABLE,cardH,14,14,'F');
  doc.setFillColor(...sc);doc.roundedRect(MG,y+3,7,cardH-6,4,4,'F');
  doc.setFontSize(22);doc.setFont('helvetica','bold');doc.setTextColor(...PK.navy);
  doc.text((r.eco||'')+' · '+(r.equipment_name||''),MG+24,y+38);
  drawStatusPill(doc,USABLE+MG-170-16,y+12,(r.final_status||'').toUpperCase(),170);
  doc.setFontSize(15);doc.setTextColor(75,91,107);doc.setFont('helvetica','normal');
  doc.text('Mecánico: '+(r.mechanic_name||'')+'  ·  '+(r.service_type||'')+(r.hour_meter?'  ·  Horómetro: '+(r.hour_meter||''):'')+(r.supervisor_name?'  ·  Supervisor: '+(r.supervisor_name||''):''),MG+24,y+66);
  var cy=y+100;
  doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(...PK.blue);doc.text('FALLA REPORTADA',MG+24,cy);cy+=24;
  doc.setFontSize(16);doc.setFont('helvetica','normal');doc.setTextColor(...PK.dkgray);
  var fl=doc.splitTextToSize(r.failure||'',USABLE-40);fl.slice(0,3).forEach(function(l){doc.text(l,MG+24,cy);cy+=28;});cy+=10;
  doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(...PK.blue);doc.text('TRABAJO REALIZADO',MG+24,cy);cy+=24;
  doc.setFontSize(16);doc.setFont('helvetica','normal');doc.setTextColor(...PK.dkgray);
  var wl=doc.splitTextToSize(r.work_done||'',USABLE-40);wl.slice(0,3).forEach(function(l){doc.text(l,MG+24,cy);cy+=28;});cy+=10;
  doc.setFontSize(14);doc.setFont('helvetica','bold');doc.setTextColor(...PK.blue);doc.text('REFACCIONES',MG+24,cy);cy+=24;
  doc.setFontSize(15);doc.setFont('helvetica','normal');doc.setTextColor(...PK.dkgray);
  var partsTxt=(r.parts_used||'').trim()?r.parts_used:'Sin refacciones registradas';
  var pl=doc.splitTextToSize(partsTxt,USABLE-40);pl.slice(0,3).forEach(function(l){doc.text(l,MG+24,cy);cy+=26;});
  if(r.evidence&&r.evidence!==''){doc.setFontSize(12);doc.setFont('helvetica','bold');doc.setTextColor(...PK.blue);doc.text('EVIDENCIA FOTOGRÁFICA ADJUNTA',MG+24,cy+38);}
  return y+cardH+16;
}

function statusColor(s){
  var st=(s||'').toUpperCase();
  if(st==='DISPONIBLE')return[25,169,116];
  if(st==='OPERATIVA'||st==='ACEPTABLE')return[220,132,0];
  if(st==='REGULAR')return PK.amber;
  if(st.includes('FUERA')||st==='MALO')return[226,70,70];
  if(st==='PENDIENTE')return PK.blue;
  if(st==='BUENO')return PK.green;
  return PK.dkgray;
}

function newDoc(){return new _jsPDF({orientation:'portrait',unit:'px',format:[PW,PH],hotfixes:['px_scaling']});}

function colWidths(pcts){return pcts.map(function(p){return USABLE*p/100;});}

function checkPage(doc,y,needed,pageN,title,projectName,dateStr,hdrH){
  if(y+needed>PH-60){
    doc.addPage();pageN.n++;
    y=drawHeader(doc,title+' (cont.)',projectName,dateStr,hdrH);
    return {y:y,newPage:true};
  }
  return {y:y,newPage:false};
}

function genDispPDF(){
  var p=project();if(!p||!(p.equipment||[]).length){toast('No hay equipos');return;}
  
  var doc=newDoc();
  var eq=p.equipment||[];
  var disp=eq.filter(function(e){return e.current_status==='DISPONIBLE';}).length;
  var ops=eq.filter(function(e){return e.current_status==='OPERATIVA';}).length;
  var fs=eq.filter(function(e){return e.current_status==='FUERA DE SERVICIO';}).length;
  var y=drawHeader(doc,'DISPONIBILIDAD DE EQUIPOS',p.name,state.date,185);
  y=drawKPIs(doc,y+15,[
    {val:String(disp),label:'DISPONIBLES',color:PK.green},
    {val:String(ops),label:'OPERATIVOS',color:PK.amber},
    {val:String(fs),label:'FUERA SERV.',color:PK.red},
    {val:String(eq.length),label:'TOTAL',color:PK.blue}
  ]);
  var cw=colWidths([27,11,15,20,27]);
  y=drawTableHead(doc,y+15,['EQUIPO','NO. ECO','HORÓMETRO','CONDICIÓN','OBSERVACIONES'],cw);
  var pg={n:1};
  var lastCat=null;
  eq.forEach(function(e){
    if(e.category!==lastCat){
      var chk=checkPage(doc,y,88,pg,'DISPONIBILIDAD DE EQUIPOS',p.name,state.date,185);y=chk.y;
      y=drawCatRow(doc,y,e.category||'SIN CATEGORIA');
      lastCat=e.category;
    }
    var chk2=checkPage(doc,y,50,pg,'DISPONIBILIDAD DE EQUIPOS',p.name,state.date,185);y=chk2.y;
    var sc=statusColor(e.current_status);
    var fonts=[
      {sz:20,style:'bold',color:PK.navy},
      {sz:18,style:'normal',color:PK.dkgray},
      {sz:14,style:'bold',color:PK.blue},
      {sz:17,style:'normal',color:PK.dkgray},
      {sz:17,style:'normal',color:PK.dkgray}
    ];
    var vals=[e.name||'',e.eco||'',e.hour_meter||'',e.current_status||'',e.notes||''];
    y=drawDataRow(doc,y,vals,cw,fonts,46,y%2===0);
    var pillX=MG+cw[0]+cw[1]+cw[2]+7;
    drawStatusPill(doc,pillX,y-46,e.current_status,cw[3]-14);
  });
  drawFooter(doc,pg.n,'Disponibilidad de Equipos — '+p.name);
  downloadPDF(doc,'Disponibilidad_'+state.date);
}

function genShiftPDF(shift){
  
  var p=project();if(!p)return;
  var isT1=shift===1;
  var doc=newDoc();
  var cons=(isT1?p.consumptions1:p.consumptions2||[]).filter(function(r){return r.work_date===state.date;});
  var reps=(isT1?p.mechanicReports1:p.mechanicReports2||[]).filter(function(r){return r.work_date===state.date;});
  var titleL='CONSUMO DE LUBRICANTES - TURNO '+shift;
  var y=drawHeader(doc,titleL,p.name,state.date,250);
  var totalL=cons.filter(function(x){return x.unit==='L';}).reduce(function(a,b){return a+b.quantity;},0);
  var totalK=cons.filter(function(x){return x.unit==='kg';}).reduce(function(a,b){return a+b.quantity;},0);
  y=drawKPIs(doc,y+20,[
    {val:String(cons.length),label:'REGISTROS',color:PK.blue},
    {val:totalL.toFixed(1)+' L',label:'TOTAL LITROS',color:PK.green},
    {val:totalK.toFixed(1)+' kg',label:'TOTAL KG',color:PK.amber}
  ]);
  var pg={n:1};
  if(cons.length){
    var cw=colWidths([25,30,16,29]);
    y=drawTableHead(doc,y+20,['EQUIPO','LUBRICANTE','CANTIDAD','OBSERVACIONES'],cw);
    var lastSup='';
    cons.forEach(function(c){
      var k=(c.supervisor_name||'').trim()||'SIN SUPERVISOR';
      if(k!==lastSup){
        var chk=checkPage(doc,y,50,pg,titleL,p.name,state.date,250);y=chk.y;
        y=drawSupRow(doc,y,k);
        lastSup=k;
      }
      var chk2=checkPage(doc,y,60,pg,titleL,p.name,state.date,250);y=chk2.y;
      var qtyStr=parseFloat(c.quantity).toFixed(2)+' '+(c.unit||'');
      var fonts=[
        {sz:20,style:'bold',color:PK.navy},
        {sz:20,style:'bold',color:PK.navy},
        {sz:18,style:'bold',color:PK.green},
        {sz:17,style:'normal',color:PK.dkgray}
      ];
      y=drawDataRow(doc,y,[c.eco+' '+(c.equipment_name||''),c.lubricant||'',qtyStr,c.notes||''],cw,fonts,50,y%2===0);
      _pill(doc,MG+cw[0]+cw[1]+7,y-50,cw[2]-14,22,...PK.green);
    });
  }
  drawFooter(doc,pg.n,'MGA — Control de lubricantes — Turno '+shift);
  if(reps.length){
    doc.addPage();pg.n=2;
    var titleM='REPORTE MECÁNICO - TURNO '+shift;
    y=drawHeader(doc,titleM,p.name,state.date,250);
    var corr=reps.filter(function(x){return x.service_type==='Correctivo';}).length;
    var pend=reps.filter(function(x){return x.final_status==='Pendiente';}).length;
    y=drawKPIs(doc,y+20,[
      {val:String(reps.length),label:'REPORTES',color:PK.blue},
      {val:String(corr),label:'CORRECTIVOS',color:PK.amber},
      {val:String(pend),label:'PENDIENTES',color:PK.red}
    ]);
    y+=15;
    var lastSupM='';
    reps.forEach(function(r){
      var k=(r.supervisor_name||'').trim()||'SIN SUPERVISOR';
      if(k!==lastSupM){
        var chkS=checkPage(doc,y,50,pg,titleM,p.name,state.date,250);y=chkS.y;
        y=drawSupRow(doc,y,k);
        lastSupM=k;
      }
      var chk=checkPage(doc,y,270,pg,titleM,p.name,state.date,250);y=chk.y;
      y=drawMechCard(doc,y,r);
    });
    drawFooter(doc,pg.n,'MGA — Reporte mecánico — Turno '+shift);
  }
  downloadPDF(doc,'Turno'+shift+'_'+state.date);
}

function genTirePDF(){

function downloadPDF(doc,name){
  var blob=doc.output('blob');
  var file=new File([blob],name+'.pdf',{type:'application/pdf'});
  if(navigator.share){
    navigator.share({title:name+'.pdf',files:[file]}).catch(function(){
      fallbackDownload(blob,name);
    });
  }else{
    fallbackDownload(blob,name);
  }
}
function fallbackDownload(blob,name){
  var url=URL.createObjectURL(blob);
  var w=window.open(url);
  if(!w||typeof w==='undefined'){
    var a=document.createElement('a');
    a.href=url;a.target='_blank';a.download=name+'.pdf';
    document.body.appendChild(a);a.click();
    setTimeout(function(){document.body.removeChild(a);},500);
  }
  setTimeout(function(){URL.revokeObjectURL(url);},120000);
}

function eqByIdOrEco(v){

function stampLid(x){if(x&&!x._lid){x._lid=Date.now().toString(36)+Math.random().toString(36).slice(2,8);}return x;}
function mergeLocalOnly(remote,local){
  const out=[].concat(remote||[]);
  (local||[]).forEach(l=>{
    if(l.id)return;
    if(!out.some(o=>o._lid&&o._lid===l._lid)){out.push(stampLid(l));}
  });
  return out;
}
function findEditIdx(arr,editing){
  if(!editing||!arr)return -1;
  for(let i=0;i<arr.length;i++){if(arr[i]&&(arr[i]._lid&&arr[i]._lid===editing._lid)||(editing.id&&arr[i].id===editing.id))return i;}
  return -1;
}

  const r={work_date:state.date,shift:shift,mechanic_name:g('fMech'),hour_meter:g('fHM'),service_type:g('fType'),failure:g('fFail'),work_done:g('fWork'),parts_used:g('fParts'),final_status:g('fStatus'),supervisor_name:g('fSup'),eco:eq?eq.eco:'',equipment_name:eq?eq.name:'',evidence:_reportEvidence||undefined};
  if(!r.mechanic_name||!r.failure){toast('Mecánico y falla son requeridos');return;}
  rememberSupervisor(r.supervisor_name);
  const editing=state.editingReport;
  const arr=p[mkey]||[];p[mkey]=arr;
  const idx=findEditIdx(arr,editing);
  r._lid=(editing&&editing._lid)||Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  if(idx>=0){Object.assign(arr[idx],r);}
  else{arr.push(r);}
  state.editingReport=null;
  saveLocal();
  const target=idx>=0?arr[idx]:r;
  persistReport(target,shift).then(saved=>{
    closeModal();render();toast('Reporte '+((idx>=0)?'actualizado':'guardado')+(p.id&&saved?' en servidor':'')+(p.id&&!saved?' (sin conexion)':''));
  }).catch(e=>{closeModal();render();toast('Error al guardar: '+e.message);});
}

function persistReport(item,shift){
  const p=project();
  if(!p.id)return Promise.resolve(false);
  const eq=eqByIdOrEco(item.eco);
  if(!eq||!eq.id){return Promise.resolve(false);}
  const payload={project_id:p.id,equipment_id:eq.id,work_date:item.work_date,shift:shift,mechanic_name:item.mechanic_name,supervisor_name:item.supervisor_name,hour_meter:item.hour_meter,service_type:item.service_type,failure:item.failure,work_done:item.work_done,parts_used:item.parts_used,final_status:item.final_status};
  if(item.evidence){payload.evidence_url=item.evidence;}
  const method=item.id?'PUT':'POST';
  const url='/mechanic-reports'+(item.id?'/'+item.id:'');
  return api(url,{method:method,body:JSON.stringify(payload)}).then(r=>r.json()).then(res=>{
    if(res.detail)throw new Error(res.detail);
    item.id=res.id;
    const e2=eqByIdOrEco(item.eco);
    if(e2){e2.current_status={Disponible:'DISPONIBLE',Operativa:'OPERATIVA','Fuera de servicio':'FUERA DE SERVICIO'}[item.final_status]||e2.current_status;saveLocal();}
    return true;
  });
}

function deleteReport(shift){
  const p=project();if(!p)return;

  const arr=p[mkey]||[];const idx=findEditIdx(arr,editing);if(idx<0)return;

      remove();toast('Reporte eliminado del servidor');
    }).catch(e=>toast('Error al eliminar: '+e.message)).finally(()=>spin(false));
  }else{remove();toast('Reporte eliminado');}
}

function tireCount(eco){
  let n=4;if(eco==='MG-044'||eco==='MG-054')n=10;else if(eco==='MG-033')n=6;return n;
}
function updateTirePositions(details,eco){
  const cur=document.getElementById('fEq')?.value||eco||'';
  const n=details?details.length:tireCount(cur);
  let h='';for(let i=1;i<=n;i++){
    const d=details?details[i-1]||{}:{};
    h+=`<div class="card"><div style="font-size:12px;font-weight:700;color:var(--navy);margin-bottom:4px">LLANTA ${i<=4?'POSICIÓN ':''}${i}</div>
    <div class="field"><select id="tSt${i}"><option>Bueno</option><option>Aceptable</option><option>Regular</option><option>Malo</option></select></div>
    <div class="field-row"><div class="field"><input id="tVU${i}" value="${(d.vida_util||'').replace(/"/g,'&quot;')}" placeholder="% Vida útil"></div><div class="field"><input id="tNt${i}" value="${(d.notes||'').replace(/"/g,'&quot;')}" placeholder="Observaciones"></div></div></div>`;
  }
  document.getElementById('tireFields').innerHTML=h;
  if(details){for(let i=1;i<=n;i++){const d=details[i-1]||{};if(d.status){const s=document.getElementById('tSt'+i);if(s)Array.from(s.options).forEach(o=>{if(o.value===d.status)s.value=d.status;});}}}
}

function saveTire(){
  const p=project();if(!p)return;
  const eco=document.getElementById('fEq')?.value||'';
  const n=tireCount(eco);
  const details=[];for(let i=1;i<=n;i++){details.push({position:String(i),status:g('tSt'+i),vida_util:g('tVU'+i),notes:g('tNt'+i)});}
  const eq=(p.equipment||[]).find(e=>e.eco===eco);
  const insp={work_date:state.date,eco:eco,equipment_name:eq?eq.name:'',hour_meter:g('fHM'),location:g('fLoc'),inspector_name:g('fInsp'),supervisor_name:g('fSup'),general_notes:g('fNotes'),details:details};
  rememberSupervisor(insp.supervisor_name);
  const editing=state.editingTire;
  const arr=p.tireInspections||[];p.tireInspections=arr;
  const idx=findEditIdx(arr,editing);
  insp._lid=(editing&&editing._lid)||Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  if(idx>=0){Object.assign(arr[idx],insp);}
  else{arr.push(insp);}
  state.editingTire=null;
  saveLocal();
  const target=idx>=0?arr[idx]:insp;
  persistTire(target).then(saved=>{
    closeModal();render();toast('Inspección '+((idx>=0)?'actualizada':'guardada')+(p.id&&saved?' en servidor':'')+(p.id&&!saved?' (sin conexion)':''));
  }).catch(e=>{closeModal();render();toast('Error al guardar: '+e.message);});
}

function persistTire(item){
  const p=project();
  if(!p.id)return Promise.resolve(false);
  const eq=eqByIdOrEco(item.eco);
  if(!eq||!eq.id)return Promise.resolve(false);
  const payload={project_id:p.id,equipment_id:eq.id,work_date:item.work_date,hour_meter:item.hour_meter,location:item.location,inspector_name:item.inspector_name,supervisor_name:item.supervisor_name,general_notes:item.general_notes,details:item.details.map(d=>({position:d.position,status:d.status,vida_util:d.vida_util,notes:d.notes}))};
  const method=item.id?'PUT':'POST';
  const url='/tire-inspections'+(item.id?'/'+item.id:'');
  return api(url,{method:method,body:JSON.stringify(payload)}).then(r=>r.json()).then(res=>{
    if(res.detail)throw new Error(res.detail);
    item.id=res.id;item.details=(res.details&&res.details.length?res.details:item.details).map(d=>({position:String(d.position),status:d.status,vida_util:d.vida_util,notes:d.notes}));return true;
  });
}

function doSync(silent){
  if(!silent){closeMenu();spin(true);}
  fetch(API+'/api/v1/projects',{headers:{'Authorization':'Bearer '+KEY}}).then(r=>r.json()).then(list=>{
    list.forEach(rp=>{
      let idx=state.projects.findIndex(p=>p.id===rp.id);
      if(idx<0){state.projects.push({name:rp.name,id:rp.id,equipment:[],consumptions1:[],consumptions2:[],mechanicReports1:[],mechanicReports2:[],tireInspections:[]});idx=state.projects.length-1;}
    });saveLocal();
    const p=project();if(p&&p.id){
      return Promise.all([
        fetch(API+'/api/v1/equipment?project_id='+p.id,{headers:{'Authorization':'Bearer '+KEY}}).then(r=>r.json()),
        fetch(API+'/api/v1/consumptions?project_id='+p.id,{headers:{'Authorization':'Bearer '+KEY}}).then(r=>r.json()),
        fetch(API+'/api/v1/mechanic-reports?project_id='+p.id,{headers:{'Authorization':'Bearer '+KEY}}).then(r=>r.json()),
        fetch(API+'/api/v1/tire-inspections?project_id='+p.id,{headers:{'Authorization':'Bearer '+KEY}}).then(r=>r.json()),
        fetch(API+'/api/v1/supervisors?project_id='+p.id,{headers:{'Authorization':'Bearer '+KEY}}).then(r=>r.json())
      ]).then(([eq,c,m,t,s])=>{
        p.equipment=(eq||[]).filter(x=>x.active!==false);state.supervisors=s||[];
        const enrich=x=>{const e=eqByIdOrEco(x.equipment_id);if(e){x.eco=e.eco;x.equipment_name=e.name;}return x;};
        p.consumptions1=mergeLocalOnly((c||[]).filter(x=>x.shift===1).map(stampLid).map(enrich),p.consumptions1);
        p.consumptions2=mergeLocalOnly((c||[]).filter(x=>x.shift===2).map(stampLid).map(enrich),p.consumptions2);
        p.mechanicReports1=mergeLocalOnly((m||[]).filter(x=>x.shift===1).map(stampLid).map(enrich),p.mechanicReports1);
        p.mechanicReports2=mergeLocalOnly((m||[]).filter(x=>x.shift===2).map(stampLid).map(enrich),p.mechanicReports2);
        p.tireInspections=mergeLocalOnly((t||[]).map(stampLid).map(enrich),p.tireInspections);saveLocal();render();if(!silent)toast('Datos sincronizados');
      });
    }
  }).catch(e=>toast('Error: '+e.message)).finally(()=>spin(false));
}

  }).then(blob=>{

    const map={equipment-status:'equipos',consumptions:'consumos',mechanic-reports:'mecanicos',tire-inspections:'llantas'};

function uploadImageFile(file,kind){
  const fd=new FormData();fd.append('file',file);
  return fetch(API+'/api/v1/uploads/'+kind,{method:'POST',headers:{'Authorization':'Bearer '+KEY},body:fd})
    .then(r=>r.json()).then(res=>{
      if(res.file_url)return res.file_url;
      if(res.detail)throw new Error(res.detail);
      throw new Error('No se pudo subir la imagen');
    });
}
function compressImage(file,cb){
  const reader=new FileReader();
  reader.onload=function(e){
    const img=new Image();
    img.onload=function(){
      const MAX=900;let w=img.width,h=img.height;
      if(w>MAX){h=Math.round(h*MAX/w);w=MAX;}
      const cv=document.createElement('canvas');cv.width=w;cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=function(){cb(null);};
    img.src=e.target.result;
  };
  reader.onerror=function(){cb(null);};
  reader.readAsDataURL(file);
}
let _reportEvidence=null;
function openEvidencePicker(){
  if(!navigator.mediaDevices&&!document.createElement('input').capture)return triggerEvidenceInput(false);
  return true;
}
function triggerEvidenceInput(capture){
  const inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  if(capture)inp.setAttribute('capture','environment');
  inp.style.display='none';
  inp.onchange=function(){
    const f=inp.files&&inp.files[0];inp.remove();
    if(!f)return;
    const p=project();
    if(p&&p.id&&KEY){
      uploadImageFile(f,'mechanic-evidence').then(url=>{
        _reportEvidence=url;
        document.getElementById('evidenceThumb')&&(document.getElementById('evidenceThumb').innerHTML='<img src="'+url+'" style="max-width:120px;max-height:90px;border-radius:8px">');
        toast('Evidencia subida');
      }).catch(e=>{
        compressImage(f,function(d){if(d){_reportEvidence=d;document.getElementById('evidenceThumb')&&(document.getElementById('evidenceThumb').innerHTML='<img src="'+d+'" style="max-width:120px;max-height:90px;border-radius:8px">');}toast('Guardando local: '+e.message);});
      });
    }else{
      compressImage(f,function(d){
        if(d){_reportEvidence=d;document.getElementById('evidenceThumb')&&(document.getElementById('evidenceThumb').innerHTML='<img src="'+d+'" style="max-width:120px;max-height:90px;border-radius:8px">');toast('Evidencia guardada (local)');}
      });
    }
  };
  document.body.appendChild(inp);inp.click();
}
